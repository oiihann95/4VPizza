<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <form>
        <h2 class="mb-4">Realizar pedido</h2>

        <section class="mb-4" aria-label="Resumen del pedido">
          <h3 class="fs-6">Tu pedido</h3>
          @if (pedidoService.pedido.length === 0) {
            <p class="text-muted">Todavía no has añadido pizzas.</p>
          } @else {
            <ul class="list-group">
              @for (item of pedidoService.pedido; track item.pizza.nombre) {
                <li class="list-group-item d-flex justify-content-between">
                  <span>{{ item.pizza.nombre }} × {{ item.cantidad }}</span>
                  <span>{{ item.pizza.precio * item.cantidad }}€</span>
                </li>
              }
            </ul>
          }
        </section>

        <div class="mb-3">
          <label for="horaPedido" class="form-label">Hora de entrega</label>
          <input type="time" class="form-control" id="horaPedido" name="horaPedido" required>
        </div>

        <div class="mb-3">
          <label for="direccion" class="form-label">Dirección de entrega</label>
          <textarea class="form-control" id="direccion" name="direccion" rows="3"
            placeholder="Introduce la dirección completa" required></textarea>
        </div>

        <fieldset class="mb-4">
          <legend class="fs-6">Tipo de pago</legend>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="tipoPago" id="pagoBizum" value="bizum" required
              (click)="onClickBizum()">
            <label class="form-check-label" for="pagoBizum">Bizum</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="tipoPago" id="pagoTarjeta" value="tarjeta"
              (click)="onClickTar()">
            <label class="form-check-label" for="pagoTarjeta">Tarjeta</label>
          </div>
        </fieldset>

        <div class="mb-3" [hidden]="esOcultoTel()">
          <label for="direccion" class="form-label">Telefono</label>
          <textarea class="form-control" id="direccion" name="direccion" rows="3" placeholder="Ejemplo:987654321"
            required></textarea>
        </div>

        <div class="mb-3" [hidden]="esOcultoTar()">
          <label for="direccion" class="form-label">Num Tarjeta</label>
          <textarea class="form-control" id="direccion" name="direccion" rows="3"
            placeholder="Ejemplo:1234 1234 1234 1234" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Realizar pedido</button>
      </form>
    </div>
  </div>
</div>
