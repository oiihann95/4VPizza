<div class="container">
    <h2 class="h2 text-center">Catalogo Pizzas</h2>
    <div class="row">
        @for (pizza of pizzasFiltrada; track pizza.nombre) {
        <div class="col-12 col-md-6 col-lg-3">
            <div class="card mb-4">
                <img [src]="pizza.imagen" class="card-img-top" [alt]="pizza.nombre">

                <div class="card-body">
                    <h5 class="card-title">{{ pizza.nombre }} {{ pizza.precio }}€</h5>
                    <p class="card-text">{{ pizza.ingredientes }}</p>

                    <div class="d-flex align-items-end gap-4">
                        <div>
                            <label for="cantidad" class="form-label">Cantidad :</label>
                            <input type="number" class="form-control" id="cantidad" min="0" max="10" step="1"
                                style="width: 80px;" value="1">
                        </div>
                        <button class="btn btn-primary text-nowrap">
                            Pedir ahora
                        </button>

                    </div>
                </div>
            </div>
        </div>
        }
    </div>
</div>
